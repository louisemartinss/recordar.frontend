<!DOCTYPE html>
<html lang="pt-BR" data-tema="roxo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../style.css">
<title>Entrar · Recordar</title>
</head>
<body class="entrada">
  <header class="faixa com-marca">
    <div class="marca">
      <img src="../icons/logo.png" alt="" width="84" height="84">
      <span class="marca-nome">Relembrar</span>
    </div>
  </header>

  <main class="caixa cartao">
    <form id="form-login">
      <label class="campo"><span>E-mail</span>
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label class="campo"><span>Senha</span>
        <input name="senha" type="password" autocomplete="current-password" required>
      </label>
      <p class="erro-form" hidden></p>
      <button type="submit" class="btn largo"><i data-icone="ok"></i> Entrar</button>
    </form>

    <p class="rodape" data-so="paciente medico">
      <a class="link" id="esqueci" href="recuperar.html">Esqueci minha senha</a>
    </p>
    <p class="rodape" data-so="paciente">
      <a class="btn suave largo" href="cadastro.html"><i data-icone="mais"></i> Criar conta</a>
    </p>
    <p class="rodape" data-so="medico">Acesso do médico. A conta é criada pela administração.</p>
    <p class="rodape" data-so="administrador">Acesso da administração.</p>
    <p class="rodape">
      <button class="ouvir-texto" id="ouvir"><i data-icone="som"></i> Ouvir instruções</button>
    </p>
    <p class="rodape outros-acessos">
      <button type="button" class="btn suave pequeno" data-tipo="paciente"><i data-icone="user"></i> Entrar como paciente</button>
      <button type="button" class="btn suave pequeno" data-tipo="medico"><i data-icone="medico"></i> Entrar como médico</button>
      <button type="button" class="btn suave pequeno" data-tipo="administrador"><i data-icone="escudo"></i> Entrar como administrador</button>
    </p>
  </main>
  <script src="../app.js"></script>
  <script src="../auth.js"></script>
</body>
</html>
